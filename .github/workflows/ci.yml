  ocaml-build:
    needs: ci-preflight
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-14
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record revision and verify the actual native platform
        run: python tools/ci_validation.py start --job ocaml-build --variant ${{ matrix.platform }} --output generated/ci/start.json
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3, pinned 2026-10-01
        with:
          ocaml-compiler: "5.4.0"
          opam-pin: false
          opam-repositories: |
            default: git+https://github.com/ocaml/opam-repository.git#ac27950e5eac6c981ad809dff370c937820b7893
      - name: Fetch exact locked upstream sources and build portable static GMP
        run: |
          python tools/prebuilt_sources.py fetch --output "$GITHUB_WORKSPACE/generated/prebuilt-sources"
          python tools/prebuilt_sources.py static-build --sources "$GITHUB_WORKSPACE/generated/prebuilt-sources" \
            --output "$GITHUB_WORKSPACE/generated/static-gmp" --platform ${{ matrix.platform }} \
            --compiler "$(command -v cc)" --make "$(command -v make)" --pkg-config "$(command -v pkg-config)"
          {
            echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/generated/static-gmp/configuration"
            echo "PKG_CONFIG_LIBDIR=$GITHUB_WORKSPACE/generated/static-gmp/configuration"
            echo "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1"
            echo "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1"
            if [ "${{ runner.os }}" = macOS ]; then echo "MACOSX_DEPLOYMENT_TARGET=14.0"; fi
          } >> "$GITHUB_ENV"
      - name: Resolve pinned native dependencies and retain the platform lock
        run: |
          opam install core/biocompiler_core.opam --deps-only --with-test --no-depexts --yes
          opam reinstall zarith.1.14 --yes --no-depexts
          opam lock core/biocompiler_core.opam
          mkdir -p generated/core
          cp biocompiler_core.opam.locked generated/core/dependencies.opam.locked
          opam switch export generated/core/switch.export
          opam list --installed --columns=name,version > generated/core/packages.txt
      - name: Install Python package and check compiler/checker dependency separation
        run: |
          python -m pip install .
          python tools/check_core_boundaries.py --output generated/core/boundaries.json
      - name: Strictly type-check the migrated Python transport boundary
        run: |
          python -m pip install --only-binary=:all: --platform any --require-hashes \
            --target generated/typecheck -r tools/typecheck-requirements.txt
          PYTHONPATH=generated/typecheck python -m mypy --config-file tools/mypy-core.ini | tee generated/core/python-types.txt
      - name: Compile native core and standalone verifier
        id: native_build
        run: |
          opam exec -- dune build --root core @all
      - name: Retain revision-bound native executables
        run: |
          cp core/_build/default/bin/core/main.exe generated/core/biocompiler-core
          cp core/_build/default/bin/verify/main.exe generated/core/biocompiler-verify
          python -c 'import hashlib,json,os,pathlib,platform; p=pathlib.Path("generated/core"); p.joinpath("binaries.json").write_text(json.dumps({"revision":os.environ["GITHUB_SHA"],"system":platform.system(),"machine":platform.machine(),"sha256":{n:hashlib.sha256(p.joinpath(n).read_bytes()).hexdigest() for n in ("biocompiler-core","biocompiler-verify")}},sort_keys=True,indent=2)+"\n")'
      - name: Retain final-byte material closure and assemble internal platform wheel
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/collect_prebuilt_materials.py --checkout "$GITHUB_WORKSPACE" \
            --sources "$GITHUB_WORKSPACE/generated/prebuilt-sources" --static-root "$GITHUB_WORKSPACE/generated/static-gmp" \
            --native-root "$GITHUB_WORKSPACE/generated/core" --switch "$(opam var prefix)" --opam "$(command -v opam)" \
            --source-revision "$GITHUB_HEAD_SHA" --tested-revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --platform ${{ matrix.platform }} --output "$GITHUB_WORKSPACE/generated/prebuilt-materials"
          if [ "${{ runner.os }}" = macOS ]; then audit_tool="$(command -v otool)"; else audit_tool="$(command -v readelf)"; fi
          audit_tool="$(python -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$audit_tool")"
          python tools/build_prebuilt_core.py wheel --source-root "$GITHUB_WORKSPACE" \
            --native-root "$GITHUB_WORKSPACE/generated/core" --platform ${{ matrix.platform }} \
            --source-revision "$GITHUB_HEAD_SHA" --tested-revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --audit-tool "$audit_tool" --materials-root "$GITHUB_WORKSPACE/generated/prebuilt-materials/files" \
            --materials "$GITHUB_WORKSPACE/generated/prebuilt-materials/materials.json" \
            --materials-authority "$GITHUB_WORKSPACE/generated/prebuilt-materials/authority.json" \
            --materials-sha256 "$(cat generated/prebuilt-materials/manifest.sha256)" \
            --output "$GITHUB_WORKSPACE/generated/prebuilt-platform"
          cp generated/prebuilt-materials/authority.json generated/prebuilt-platform/material-authority.json
          cp generated/prebuilt-materials/manifest.sha256 generated/prebuilt-platform/material-manifest.sha256
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: prebuilt-${{ matrix.platform }}
          path: generated/prebuilt-platform
          if-no-files-found: error
          retention-days: 30
      - name: Bundle the exact compiled native suite and production roles
        run: python tools/ci_native_bundle.py bundle --path generated/native-bundle/native.zip
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: native-bundle-${{ matrix.platform }}
          path: generated/native-bundle/native.zip
          if-no-files-found: error
      - name: Retain native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.platform }}
          path: generated/core/
          if-no-files-found: warn
          overwrite: true
          retention-days: 7
      - name: Record successful complete ocaml-build
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/ocaml-build-${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-job-ocaml-build-${{ matrix.platform }}
          path: generated/ci/ocaml-build-${{ matrix.platform }}.json
          if-no-files-found: error

  ocaml-native-tests:
    needs: ocaml-build
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-14
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/ci_validation.py start --job ocaml-native-tests --variant ${{ matrix.platform }} --output generated/ci/start.json
      - uses: actions/download-artifact@v4
        with:
          name: native-bundle-${{ matrix.platform }}
          path: artifacts/native-bundle
      - name: Restore exact source and platform bound compiled executables
        run: python tools/ci_native_bundle.py restore --path artifacts/native-bundle/native.zip
      - name: Run every native literal and mutation suite
        run: |
          set -o pipefail
          mkdir -p generated/core
          BIOCOMPILER_ARCHIVE_PYTHON311_CORPUS="$GITHUB_WORKSPACE/tests/conformance/archive-container-311.json" \
          BIOCOMPILER_ARCHIVE_PYTHON314_CORPUS="$GITHUB_WORKSPACE/tests/conformance/archive-container-314.json" \
          BIOCOMPILER_REFERENCE_PACKAGE_PYTHON311_CORPUS="$GITHUB_WORKSPACE/tests/conformance/reference-package-domains-311.json" \
          BIOCOMPILER_REFERENCE_PACKAGE_PYTHON314_CORPUS="$GITHUB_WORKSPACE/tests/conformance/reference-package-domains-314.json" \
          BIOCOMPILER_REFERENCE_SEQUENCE_EXPORT_CORPUS="$GITHUB_WORKSPACE/tests/conformance/reference-sequence-export-314.json" \
          BIOCOMPILER_REFERENCE_INPUTS_CORPUS="$GITHUB_WORKSPACE/tests/conformance/reference-inputs-311.json" \
          BIOCOMPILER_REFERENCE_PACKAGE_WORKFLOW_CORPUS="$GITHUB_WORKSPACE/tests/conformance/reference-packages-311.json" \
          BIOCOMPILER_REFERENCE_CONTRACTS_DOCUMENTS="$GITHUB_WORKSPACE/tests/conformance/reference-contracts-v1" \
          BIOCOMPILER_REFERENCE_CONTRACTS_CORPUS="$GITHUB_WORKSPACE/tests/conformance/reference-contracts-v1.json" \
          BIOCOMPILER_REFERENCE_PIPELINE_DOCUMENTS="$GITHUB_WORKSPACE/tests/conformance/reference-pipeline-semantics-v1" \
          BIOCOMPILER_CANDIDATE_RUNTIME_CORPUS="$GITHUB_WORKSPACE/tests/conformance/candidate-runtime-v1.json" \
          BIOCOMPILER_COMPONENT_RUNTIME_CORPUS="$GITHUB_WORKSPACE/tests/conformance/component-runtime-v1.json" \
          BIOCOMPILER_REALIZATION_FOUNDATION_CORPUS="$GITHUB_WORKSPACE/tests/conformance/realization-foundation-v1.json" \
          BIOCOMPILER_REALIZATION_CHECKS_CORPUS="$GITHUB_WORKSPACE/tests/conformance/realization-checks-v1.json" \
          BIOCOMPILER_COMPONENT_ACCEPTANCE_CORPUS="$GITHUB_WORKSPACE/tests/conformance/component-acceptance-v1.json" \
          BIOCOMPILER_SYNTHETIC_AUTHORITY_CORPUS="$GITHUB_WORKSPACE/tests/conformance/synthetic-authority-v1.json" \
          BIOCOMPILER_SYNTHETIC_ACCEPTANCE_CORPUS="$GITHUB_WORKSPACE/tests/conformance/synthetic-acceptance-v1.json" \
          BIOCOMPILER_SYNTHETIC_PRODUCERS_CORPUS="$GITHUB_WORKSPACE/tests/conformance/synthetic-producers-v1.json" \
          BIOCOMPILER_REALIZATION_WORKFLOW_CORPUS="$GITHUB_WORKSPACE/tests/conformance/realization-workflow-v1.json" \
          BIOCOMPILER_CHECKED_PIPELINE_CORPUS="$GITHUB_WORKSPACE/tests/conformance/checked-pipeline-v1.json" \
          BIOCOMPILER_FIXED_PIPELINE_CONTINUATIONS="$GITHUB_WORKSPACE/tests/conformance/fixed-pipeline-continuations-native-v1.json" \
          BIOCOMPILER_FIXED_PIPELINE_CORPUS="$GITHUB_WORKSPACE/tests/conformance/fixed-pipeline-native-v1.json" \
          BIOCOMPILER_LOWERING_CORPUS="$GITHUB_WORKSPACE/tests/conformance/lowering-v1.json" \
          BIOCOMPILER_PIPELINE_CALLBACK_SEMANTICS="$GITHUB_WORKSPACE/tests/conformance/pipeline-callback-semantics-v1.json" \
          BIOCOMPILER_PIPELINE_CALLBACK_DECLARATION="$GITHUB_WORKSPACE/protocol/pipeline-callback-channel-v1.json" \
          BIOCOMPILER_PIPELINE_CALLBACK_MANAGER_DECLARATION="$GITHUB_WORKSPACE/protocol/pipeline-callback-manager-v1.json" \
          BIOCOMPILER_PIPELINE_SESSION_DECLARATION="$GITHUB_WORKSPACE/protocol/pipeline-session-v1.json" \
          BIOCOMPILER_PIPELINE_CONTRACT_LITERALS="$GITHUB_WORKSPACE/tests/conformance/pipeline-contract-literals-v1.json" \
          BIOCOMPILER_SYNTHETIC_INSPECTION_DECLARATION="$GITHUB_WORKSPACE/protocol/synthetic-inspection-v1.json" \
          BIOCOMPILER_SYNTHETIC_INSPECTION_FIXTURES="$GITHUB_WORKSPACE/tests/conformance/synthetic-inspection-supplemental-v1.json" \
            python tools/ci_native_bundle.py test --path generated/core/native-suites --workers 2 2>&1 | tee generated/core/native-tests.txt
      - name: Retain native suite diagnostics before longer installed campaigns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-native-tests-${{ matrix.platform }}
          path: generated/core/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      - name: Record successful complete ocaml-native-tests
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/ocaml-native-tests-${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-job-ocaml-native-tests-${{ matrix.platform }}
          path: generated/ci/ocaml-native-tests-${{ matrix.platform }}.json
          if-no-files-found: error

  ocaml-core:
    needs: ocaml-build
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-14
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/ci_validation.py start --job ocaml-core --variant ${{ matrix.platform }} --output generated/ci/start.json
      - uses: actions/download-artifact@v4
        with:
          name: native-bundle-${{ matrix.platform }}
          path: artifacts/native-bundle
      - name: Restore exact source and platform bound compiled executables
        id: restore_native
        run: python tools/ci_native_bundle.py restore --path artifacts/native-bundle/native.zip
      - uses: actions/download-artifact@v4
        with:
          name: core-${{ matrix.platform }}
          path: generated/core
      - run: python -m pip install .
      - name: Run every original direct-core command group with bounded overlap
        if: ${{ !cancelled() && steps.restore_native.outcome == 'success' }}
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/ci_core_groups.py run --output generated/core/command-groups --workers 2
      - name: Require complete current direct-core command and log accounting
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/ci_core_groups.py check --output generated/core/command-groups
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: native-checks-${{ matrix.platform }}
          path: generated/core/
          if-no-files-found: error
      - name: Record successful complete ocaml-core
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/ocaml-core-${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-job-ocaml-core-${{ matrix.platform }}
          path: generated/ci/ocaml-core-${{ matrix.platform }}.json
          if-no-files-found: error

  architecture-sdk:
    needs: ocaml-build
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.11"
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.14"
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.11"
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/ci_validation.py start --job architecture-sdk --variant ${{ matrix.platform }}-py${{ matrix.python-version }} --output generated/ci/start.json
      - uses: actions/download-artifact@v4
        with:
          name: native-bundle-${{ matrix.platform }}
          path: artifacts/native-bundle
      - name: Restore exact source and platform bound compiled executables
        run: python tools/ci_native_bundle.py restore --path artifacts/native-bundle/native.zip
      - run: python -m pip install .
      - name: Check installed public architecture SDK and CLI on selected Python runtime
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/architecture-routing-${{ matrix.python-version }}"
          cd "$RUNNER_TEMP/architecture-routing-${{ matrix.python-version }}"
          python "$GITHUB_WORKSPACE/tools/check_architecture_routing.py" \
            --core "$GITHUB_WORKSPACE/core/_build/default/bin/core/main.exe" \
            --verify "$GITHUB_WORKSPACE/core/_build/default/bin/verify/main.exe" \
            --workers 2 --output "$GITHUB_WORKSPACE/generated/core/architecture-routing-${{ matrix.python-version }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: architecture-sdk-${{ matrix.platform }}-py${{ matrix.python-version }}
          path: generated/core/
          if-no-files-found: error
      - name: Record successful complete architecture-sdk
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/architecture-sdk-${{ matrix.platform }}-py${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-job-architecture-sdk-${{ matrix.platform }}-py${{ matrix.python-version }}
          path: generated/ci/architecture-sdk-${{ matrix.platform }}-py${{ matrix.python-version }}.json
          if-no-files-found: error

  architecture-core-reproducibility:
    needs: [ocaml-build, architecture-sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record job authority and start time
        run: python tools/ci_validation.py start --job architecture-core-reproducibility --variant cross-platform --output generated/ci/start.json
      - uses: actions/download-artifact@v4
        with:
          name: core-linux-x86_64
          path: artifacts/core/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: core-macos-arm64
          path: artifacts/core/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          pattern: architecture-sdk-linux-x86_64-py*
          path: artifacts/core/linux-x86_64
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: architecture-sdk-macos-arm64-py*
          path: artifacts/core/macos-arm64
          merge-multiple: true
      - name: Install Python package for retained artifact comparison
        run: python -m pip install .
      - name: Compare exact SDK and CLI artifacts across Python versions and native platforms
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_architecture_routing_reproducibility.py --root artifacts/core --output generated/core-reproducibility/receipt.json
      - name: Retain complete comparison receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-core-reproducibility
          path: generated/core-reproducibility/receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Record successful validation and runtime
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/architecture-core-reproducibility-cross-platform.json
      - name: Retain required job receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-architecture-core-reproducibility-cross-platform
          path: generated/ci/architecture-core-reproducibility-cross-platform.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  installed-campaigns:
    needs: [ocaml-build, prebuilt-core-assembly]
    runs-on: ${{ matrix.runner }}
    # Each platform/Python slot retains all 17 campaigns across five groups.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.11"
            group: fixed
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.14"
            group: fixed
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.11"
            group: fixed
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.14"
            group: fixed
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.11"
            group: protocol
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.14"
            group: protocol
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.11"
            group: protocol
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.14"
            group: protocol
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.11"
            group: manager
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.14"
            group: manager
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.11"
            group: manager
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.14"
            group: manager
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.11"
            group: workflow
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.14"
            group: workflow
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.11"
            group: workflow
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.14"
            group: workflow
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.11"
            group: synthetic
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.14"
            group: synthetic
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.11"
            group: synthetic
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.14"
            group: synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bind the required Python and native platform variant
        run: python tools/ci_validation.py start --job installed-campaigns --variant ${{ matrix.platform }}-py${{ matrix.python-version }}-${{ matrix.group }} --output generated/ci/start.json
      - uses: actions/download-artifact@v4
        with:
          name: core-${{ matrix.platform }}
          path: artifacts/native
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt-wheelhouse
          path: artifacts/prebuilt-wheelhouse
      - name: Execute the complete selected installed campaign group in a fresh wheel-only environment
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/prebuilt_release_pipeline.py installed --checkout "$GITHUB_WORKSPACE" \
            --sdk "$GITHUB_WORKSPACE/artifacts/prebuilt-wheelhouse/biocompiler-0.1.0.dev29-py3-none-any.whl" \
            --native "$(python -c 'import pathlib; import sys; sys.path.insert(0,"tools"); import build_prebuilt_core as b; print((pathlib.Path("artifacts/prebuilt-wheelhouse")/("biocompiler_core-"+b.VERSION+"-"+b.TARGETS["${{ matrix.platform }}"][2]+".whl")).resolve())')" \
            --environment "$RUNNER_TEMP/biocompiler-fresh-${{ matrix.python-version }}" \
            --source-revision "$GITHUB_HEAD_SHA" --tested-revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --platform ${{ matrix.platform }} --group ${{ matrix.group }} --output "$GITHUB_WORKSPACE/generated/realization"
      - name: Retain complete protocol and SDK artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-campaign-${{ matrix.platform }}-py${{ matrix.python-version }}-${{ matrix.group }}
          path: generated/realization/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Record successful complete installed-campaigns
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/installed-campaigns-${{ matrix.platform }}-py${{ matrix.python-version }}-${{ matrix.group }}.json
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-job-installed-campaigns-${{ matrix.platform }}-py${{ matrix.python-version }}-${{ matrix.group }}
          path: generated/ci/installed-campaigns-${{ matrix.platform }}-py${{ matrix.python-version }}-${{ matrix.group }}.json
          if-no-files-found: error

  realization-conformance:
    needs: [installed-campaigns, prebuilt-core-assembly]
    timeout-minutes: 20
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.11"
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python-version: "3.14"
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.11"
          - runner: macos-14
            platform: macos-arm64
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/ci_validation.py start --job realization-conformance --variant ${{ matrix.platform }}-py${{ matrix.python-version }} --output generated/ci/start.json
      - uses: actions/download-artifact@v4
        with:
          name: installed-campaign-${{ matrix.platform }}-py${{ matrix.python-version }}-protocol
          path: artifacts/groups/protocol
      - uses: actions/download-artifact@v4
        with:
          name: installed-campaign-${{ matrix.platform }}-py${{ matrix.python-version }}-manager
          path: artifacts/groups/manager
      - uses: actions/download-artifact@v4
        with:
          name: installed-campaign-${{ matrix.platform }}-py${{ matrix.python-version }}-fixed
          path: artifacts/groups/fixed
      - uses: actions/download-artifact@v4
        with:
          name: installed-campaign-${{ matrix.platform }}-py${{ matrix.python-version }}-workflow
          path: artifacts/groups/workflow
      - uses: actions/download-artifact@v4
        with:
          name: installed-campaign-${{ matrix.platform }}-py${{ matrix.python-version }}-synthetic
          path: artifacts/groups/synthetic
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt-wheelhouse
          path: artifacts/prebuilt-wheelhouse
      - name: Reconstruct every campaign and installed lifecycle without omissions
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/prebuilt_release_pipeline.py aggregate --root artifacts/groups \
            --candidate artifacts/prebuilt-wheelhouse/candidate.json --output generated/realization \
            --source-revision "$GITHUB_HEAD_SHA" --tested-revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --platform ${{ matrix.platform }} --python-minor ${{ matrix.python-version }}
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: realization-${{ matrix.platform }}-py${{ matrix.python-version }}
          path: generated/realization/
          if-no-files-found: error
      - name: Record successful complete realization-conformance
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/realization-conformance-${{ matrix.platform }}-py${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-job-realization-conformance-${{ matrix.platform }}-py${{ matrix.python-version }}
          path: generated/ci/realization-conformance-${{ matrix.platform }}-py${{ matrix.python-version }}.json
          if-no-files-found: error

  realization-core-reproducibility:
    needs: [ocaml-build, realization-conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: reference_python311
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v5
        id: reference_python314
        with:
          python-version: "3.14"
          update-environment: false
      - name: Record job authority and start time
        run: python tools/ci_validation.py start --job realization-core-reproducibility --variant cross-platform --output generated/ci/start.json
      - uses: actions/download-artifact@v4
        with:
          name: core-linux-x86_64
          path: artifacts/core/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: core-macos-arm64
          path: artifacts/core/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          pattern: realization-*
          path: artifacts/realization
      - name: Install package for complete frozen conformance expectations
        run: |
          "${{ steps.reference_python311.outputs.python-path }}" -m pip install .
          "${{ steps.reference_python314.outputs.python-path }}" -m pip install .
      - name: Require exact complete results across both Python versions and native platforms
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_realization_reproducibility.py --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/receipt.json
      - name: Require complete workflow artifacts and semantic receipts across all four runtimes
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_workflow_reproducibility.py --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/workflow.json
      - name: Require complete native presentation evidence across all four runtimes
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_native_workflow_presentation.py --compare --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/workflow-presentation.json
      - name: Require complete source-authority preflight evidence across all four runtimes
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_native_workflow_authority.py --compare --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/workflow-authority.json
      - name: Require complete public SDK workflow views across all four runtimes
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_native_workflow_public_sdk.py --compare --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/workflow-public-sdk.json
      - name: Require complete actual installed workflow CLI children across all four runtimes
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_native_workflow_cli.py --compare --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/workflow-cli.json
      - name: Require complete native producer evidence across all four runtimes
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_native_synthetic_producer.py --compare --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/synthetic-producer.json
      - name: Require complete public synthetic SDK observations across all four runtimes
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_native_synthetic_public_sdk.py --compare --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/synthetic-public-sdk.json
      - name: Require complete synthetic selection CLI observations across all four runtimes
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_native_synthetic_selection_cli.py --compare --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/synthetic-selection-cli.json
      - name: Require every original synthetic helper observation across all four runtimes
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_native_synthetic_inspection.py --compare --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/synthetic-inspection.json
      - name: Require complete live pipeline sessions across all four runtimes
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_pipeline_session_install.py --compare --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/pipeline-session.json
      - name: Require complete live manager identity, comparison and deferred-access replay
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_pipeline_manager_install.py --compare --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/pipeline-manager.json
      - name: Require complete fixed-provider typed returns and source identities across all four runtimes
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_pipeline_fixed_provider_install.py --compare --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/pipeline-fixed-providers.json
      - name: Require original retained-manager continuations and complete public build identities across all four runtimes
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_pipeline_fixed_continuation_install.py --compare --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/pipeline-fixed-continuations.json
      - name: Require original fixed registration interception and retained rejection state across all four runtimes
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/check_pipeline_fixed_registration_install.py --compare --root artifacts/realization --native-root artifacts/core --output generated/realization-reproducibility/pipeline-fixed-registration.json
      - name: Reconstruct original reference workflows with each actual Python runtime across all four installed slots
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/check_pipeline_reference_install.py --compare \
            --root artifacts/realization --native-root artifacts/core \
            --python311 "${{ steps.reference_python311.outputs.python-path }}" \
            --python314 "${{ steps.reference_python314.outputs.python-path }}" \
            --output generated/realization-reproducibility/pipeline-reference.json
      - name: Retain complete comparison receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realization-core-reproducibility
          path: generated/realization-reproducibility/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Record successful complete comparison
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/realization-core-reproducibility-cross-platform.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-job-realization-core-reproducibility-cross-platform
          path: generated/ci/realization-core-reproducibility-cross-platform.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  studio-typescript:
    needs: ci-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record job authority and start time
        run: python tools/ci_validation.py start --job studio-typescript --variant 3.11 --output generated/ci/start.json
      - name: Install package and pinned TypeScript tooling without lifecycle scripts
        run: |
          python -m pip install .
          npm --prefix studio ci --ignore-scripts
      - name: Require strict types and exact committed release assets before rebuilding
        run: |
          npm --prefix studio run typecheck
          npm --prefix studio run check:assets
          npm --prefix studio test
          python tools/migration_inventory.py --check
      - name: Record successful TypeScript validation
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/studio-typescript-3.11.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-job-studio-typescript-3.11
          path: generated/ci/studio-typescript-3.11.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  prebuilt-core-assembly:
    needs: ocaml-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/ci_validation.py start --job prebuilt-core-assembly --variant cross-platform --output generated/ci/start.json
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt-linux-x86_64
          path: artifacts/prebuilt/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt-macos-arm64
          path: artifacts/prebuilt/macos-arm64
      - name: Independently check final native wheels and complete source companions
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -c 'import json,pathlib; r=pathlib.Path("artifacts/prebuilt"); d={p.name:{"authority":json.loads((p/"material-authority.json").read_text()),"manifest_sha256":(p/"material-manifest.sha256").read_text().strip()} for p in r.iterdir()}; pathlib.Path("artifacts/material-authorities.json").write_text(json.dumps(d,sort_keys=True,separators=(",",":"))+"\n")'
          python tools/check_prebuilt_core_release.py --platform-root artifacts/prebuilt/linux-x86_64 artifacts/prebuilt/macos-arm64 \
            --material-authorities artifacts/material-authorities.json --source-root "$GITHUB_WORKSPACE" \
            --source-revision "$GITHUB_HEAD_SHA" --tested-revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --output generated/prebuilt-candidate/native.json
      - name: Build one pure SDK wheel with exact reviewed platform pins
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r tools/prebuilt-build-requirements.txt
          python tools/prebuilt_release_pipeline.py sdk --checkout "$GITHUB_WORKSPACE" \
            --manifests "$GITHUB_WORKSPACE/artifacts/prebuilt/linux-x86_64/distribution.json" "$GITHUB_WORKSPACE/artifacts/prebuilt/macos-arm64/distribution.json" \
            --staging "$RUNNER_TEMP/sdk-build" --output "$GITHUB_WORKSPACE/generated/prebuilt-wheelhouse"
          cp artifacts/prebuilt/linux-x86_64/*.whl artifacts/prebuilt/macos-arm64/*.whl generated/prebuilt-wheelhouse/
      - name: Independently verify complete SDK contents and both native release pins
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/check_prebuilt_core_release.py --platform-root artifacts/prebuilt/linux-x86_64 artifacts/prebuilt/macos-arm64 \
            --material-authorities artifacts/material-authorities.json --source-root "$GITHUB_WORKSPACE" \
            --source-revision "$GITHUB_HEAD_SHA" --tested-revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --sdk generated/prebuilt-wheelhouse/biocompiler-0.1.0.dev29-py3-none-any.whl \
            --output generated/prebuilt-wheelhouse/candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prebuilt-wheelhouse
          path: generated/prebuilt-wheelhouse
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/prebuilt-core-assembly-cross-platform.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: ci-job-prebuilt-core-assembly-cross-platform
          path: generated/ci/prebuilt-core-assembly-cross-platform.json
          if-no-files-found: error
          retention-days: 30

  prebuilt-core-validation:
    if: always()
    needs: [ocaml-build, ocaml-core, ocaml-native-tests, architecture-sdk, architecture-core-reproducibility, prebuilt-core-assembly, realization-conformance, realization-core-reproducibility]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/ci_validation.py start --job prebuilt-core-validation --variant cross-platform --output generated/ci/start.json
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt-wheelhouse
          path: artifacts/prebuilt-wheelhouse
      - uses: actions/download-artifact@v4
        with:
          name: realization-linux-x86_64-py3.11
          path: artifacts/installed/linux-x86_64-py3.11
      - uses: actions/download-artifact@v4
        with:
          name: realization-linux-x86_64-py3.14
          path: artifacts/installed/linux-x86_64-py3.14
      - uses: actions/download-artifact@v4
        with:
          name: realization-macos-arm64-py3.11
          path: artifacts/installed/macos-arm64-py3.11
      - uses: actions/download-artifact@v4
        with:
          name: realization-macos-arm64-py3.14
          path: artifacts/installed/macos-arm64-py3.14
      - name: Require exact wheel, lifecycle, full campaign and independent job accounting
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREBUILT_NEEDS: ${{ toJSON(needs) }}
        run: |
          python -c 'import os,pathlib; pathlib.Path("artifacts/needs.json").write_text(os.environ["PREBUILT_NEEDS"])'
          python tools/check_prebuilt_matrix.py --root artifacts/installed --candidate artifacts/prebuilt-wheelhouse/candidate.json \
            --needs artifacts/needs.json --source-revision "$GITHUB_HEAD_SHA" --tested-revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --output generated/prebuilt-validation/receipt.json
          python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/prebuilt-core-validation-cross-platform.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: prebuilt-release-validation
          path: generated/prebuilt-validation
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: ci-job-prebuilt-core-validation-cross-platform
          path: generated/ci/prebuilt-core-validation-cross-platform.json
          if-no-files-found: error
          retention-days: 30

  validation:
    name: Validation complete
    if: always()
    needs:
      - ci-preflight
      - ocaml-build
      - ocaml-native-tests
      - architecture-sdk
      - installed-campaigns
      - unit-plan
      - unit-tests
      - unit-accounting
      - installed-executable
      - installed-architecture
      - circuit-integration
      - integration-examples
      - studio-browser
      - executable-rna-reproducibility
      - payload-architecture-reproducibility
      - circuit-reproducibility
      - ocaml-core
      - architecture-core-reproducibility
      - realization-conformance
      - realization-core-reproducibility
      - studio-typescript
      - prebuilt-core-assembly
      - prebuilt-core-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-job-*
          path: generated/ci-job-receipts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-accounting-py*
          path: generated/ci-test-accounting
          merge-multiple: true
      - name: Reject missing, skipped, cancelled, failed or stale required work
        if: always()
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python tools/ci_validation.py gate --receipts generated/ci-job-receipts --accounting generated/ci-test-accounting --output generated/validation/receipt.json
      - name: Retain final revision, job, test coverage and timing receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-receipt
          path: generated/validation/receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
