  executable-rna-reproducibility:
    needs: installed-executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record job authority and start time
        run: python tools/ci_validation.py start --job executable-rna-reproducibility --variant cross-python --output generated/ci/start.json
      - uses: actions/download-artifact@v4
        with:
          name: executable-rna-payload-py3.11
          path: artifacts/python311
      - uses: actions/download-artifact@v4
        with:
          name: executable-rna-payload-py3.14
          path: artifacts/python314
      - name: Compare exact RNA and contract artifacts across Python versions
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          roots = [Path('artifacts/python311'), Path('artifacts/python314')]
          manifests = [{str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in root.rglob('*') if p.is_file()} for root in roots]
          assert manifests[0], 'Missing executable RNA artifacts'
          assert manifests[0] == manifests[1], 'Cross-Python RNA artifacts differ'
          for name, digest in sorted(manifests[0].items()):
              print(digest, name)
          PY
      - name: Record successful validation and runtime
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/executable-rna-reproducibility-cross-python.json
      - name: Retain required job receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-executable-rna-reproducibility-cross-python
          path: generated/ci/executable-rna-reproducibility-cross-python.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  payload-architecture-reproducibility:
    needs: installed-architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record job authority and start time
        run: python tools/ci_validation.py start --job payload-architecture-reproducibility --variant cross-python --output generated/ci/start.json
      - uses: actions/download-artifact@v4
        with:
          name: payload-architecture-py3.11
          path: artifacts/python311
      - uses: actions/download-artifact@v4
        with:
          name: payload-architecture-py3.14
          path: artifacts/python314
      - name: Compare complete source, model, RNA, matching, control and manifest artifacts across Python versions
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          roots = [Path('artifacts/python311'), Path('artifacts/python314')]
          manifests = [{str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in root.rglob('*') if p.is_file()} for root in roots]
          cases = [*'abcdef', 'automatic_timing', 'automatic_b', 'automatic_f',
                   'memory_reset', 'state_reset', 'production_adjustment', 'activity_control']
          required = {f'{case}/{name}' for case in cases
                      for name in ('request.json', 'build.json', 'payloads.fasta', 'manifest.json',
                                   'cli.build.json', 'cli.export.json', 'cli.verification.json')}
          assert required <= manifests[0].keys(), 'Missing complete architecture acceptance artifacts'
          assert manifests[0] == manifests[1], 'Cross-Python architecture artifacts differ'
          for name, digest in sorted(manifests[0].items()):
              print(digest, name)
          print('Identical artifacts:', len(manifests[0]))
          PY
      - name: Record successful validation and runtime
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/payload-architecture-reproducibility-cross-python.json
      - name: Retain required job receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-payload-architecture-reproducibility-cross-python
          path: generated/ci/payload-architecture-reproducibility-cross-python.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

