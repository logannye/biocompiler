name: Compiler checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Only newer revisions of the same PR replace prior work. Main pushes and
# manual runs keep unique groups, so neither can cancel another needed run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Explicit bash makes piped checker/type-check failures fail their run step.
defaults:
  run:
    shell: bash

jobs:
  ci-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/ci_validation.py start --job ci-preflight --variant ${{ matrix.python-version }} --output generated/ci/start.json
      - name: Validate source, corpus and installed command plans without native execution
        env:
          PYTHONPATH: src:.
        run: |
          python -B -m unittest tests.test_ci_validation tests.test_prebuilt_ci_plan tests.test_prebuilt_release_chain tests.test_prebuilt_sdk_matrix tests.test_ci_scheduling tests.test_ci_native_bundle tests.test_ci_core_groups tests.test_realization_protocol_parallel tests.test_native_fixture_wiring tests.test_pipeline_reference_runtime tests.test_architecture_routing_parallel tests.test_architecture_routing_reproducibility tests.test_architecture_routing_corpus tests.test_pipeline_authoring_sources tests.test_prebuilt_command_diagnostics tests.test_pipeline_fixed_continuation_identity tests.test_pipeline_occurrence_source tests.test_pipeline_fixed_continuation_workers
          python -B tools/check_ci_preflight.py --output generated/preflight/campaigns.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: preflight-${{ matrix.python-version }}
          path: generated/preflight/
          if-no-files-found: warn
      - name: Record successful complete ci-preflight
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/ci-preflight-${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-job-ci-preflight-${{ matrix.python-version }}
          path: generated/ci/ci-preflight-${{ matrix.python-version }}.json
          if-no-files-found: error

  unit-plan:
    needs: ci-preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record tested revision and platform
        run: python -c "import os, platform; print('Revision:', os.environ['GITHUB_SHA']); print('Platform:', platform.platform()); print('Python:', platform.python_version())"
      - name: Install package
        run: python -m pip install .
      - name: Discover every test and balance five whole-class shards
        run: python tools/test_shards.py plan --start-directory tests --shards 5 --output generated/unit-plan/plan.json
      - name: Retain exact test plan
        uses: actions/upload-artifact@v4
        with:
          name: unit-plan-py${{ matrix.python-version }}
          path: generated/unit-plan/plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  unit-tests:
    needs: unit-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        python-version: ["3.11", "3.14"]
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record tested revision and platform
        run: python -c "import os, platform; print('Revision:', os.environ['GITHUB_SHA']); print('Platform:', platform.platform()); print('Python:', platform.python_version())"
      - name: Install package
        run: python -m pip install .
      - uses: actions/download-artifact@v4
        with:
          name: unit-plan-py${{ matrix.python-version }}
          path: generated/unit-plan
      - name: Rediscover and execute assigned tests with timing and accounting
        run: python tools/test_shards.py run --plan generated/unit-plan/plan.json --shard ${{ matrix.shard }} --output generated/unit-result/shard-${{ matrix.shard }}.json
      - name: Retain test outcomes even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-result-py${{ matrix.python-version }}-shard-${{ matrix.shard }}
          path: generated/unit-result/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  unit-accounting:
    if: always()
    needs: [unit-plan, unit-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record tested revision and platform
        run: python -c "import os, platform; print('Revision:', os.environ['GITHUB_SHA']); print('Platform:', platform.platform()); print('Python:', platform.python_version())"
      - name: Install package
        run: python -m pip install .
      - uses: actions/download-artifact@v4
        with:
          name: unit-plan-py${{ matrix.python-version }}
          path: generated/unit-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-result-py${{ matrix.python-version }}-shard-*
          path: generated/unit-results
          merge-multiple: true
      - name: Require every discovered test exactly once and all shards successful
        if: always()
        run: |
          python tools/test_shards.py verify --plan generated/unit-plan/plan.json \
            --result generated/unit-results/shard-0.json --result generated/unit-results/shard-1.json \
            --result generated/unit-results/shard-2.json --result generated/unit-results/shard-3.json \
            --result generated/unit-results/shard-4.json --output generated/unit-accounting/accounting-py${{ matrix.python-version }}.json
      - name: Retain coverage accounting and measured shard runtimes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-accounting-py${{ matrix.python-version }}
          path: generated/unit-accounting/accounting-py${{ matrix.python-version }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  installed-executable:
    needs: ci-preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record tested revision and platform
        run: python -c "import os, platform; print('Revision:', os.environ['GITHUB_SHA']); print('Platform:', platform.platform()); print('Python:', platform.python_version())"
      - name: Record job authority and start time
        run: python tools/ci_validation.py start --job installed-executable --variant ${{ matrix.python-version }} --output generated/ci/start.json
      - name: Install package
        run: python -m pip install .
      - name: Compile and independently replay executable RNA payloads outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          PAYLOAD_OUTPUT: ${{ github.workspace }}/generated/executable-rna-payload-ci
        run: |
          python "$GITHUB_WORKSPACE/examples/executable_payload.py" --output "$PAYLOAD_OUTPUT"
          biocompiler payload-build --request "$PAYLOAD_OUTPUT/request.json" --output "$PAYLOAD_OUTPUT/cli.build.json"
          biocompiler payload-verify "$PAYLOAD_OUTPUT/cli.build.json" --expected-request "$PAYLOAD_OUTPUT/request.json" > "$PAYLOAD_OUTPUT/verification.json"
          biocompiler payload-fasta "$PAYLOAD_OUTPUT/cli.build.json" --expected-request "$PAYLOAD_OUTPUT/request.json" > "$PAYLOAD_OUTPUT/cli.fasta"
          biocompiler inspect "$PAYLOAD_OUTPUT/cli.build.json" > "$PAYLOAD_OUTPUT/inspection.json"
          python -c "import os, pathlib; p = pathlib.Path(os.environ['PAYLOAD_OUTPUT']); assert (p / 'build.json').read_bytes() == (p / 'cli.build.json').read_bytes(); assert (p / 'payloads.fasta').read_bytes() == (p / 'cli.fasta').read_bytes()"
      - name: Retain executable RNA payload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: executable-rna-payload-py${{ matrix.python-version }}
          path: generated/executable-rna-payload-ci/
          if-no-files-found: error
          retention-days: 7
      - name: Record successful validation and runtime
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/installed-executable-${{ matrix.python-version }}.json
      - name: Retain required job receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-installed-executable-${{ matrix.python-version }}
          path: generated/ci/installed-executable-${{ matrix.python-version }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  installed-architecture:
    needs: ci-preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record tested revision and platform
        run: python -c "import os, platform; print('Revision:', os.environ['GITHUB_SHA']); print('Platform:', platform.platform()); print('Python:', platform.python_version())"
      - name: Record job authority and start time
        run: python tools/ci_validation.py start --job installed-architecture --variant ${{ matrix.python-version }} --output generated/ci/start.json
      - name: Install package
        run: python -m pip install .
      - name: Compile and independently replay RNA architectures, automatic matches and controls outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          ARCHITECTURE_OUTPUT: ${{ github.workspace }}/generated/payload-architecture-ci
        run: python "$GITHUB_WORKSPACE/tools/check_payload_architecture_install.py" --output "$ARCHITECTURE_OUTPUT"
      - name: Retain complete RNA architecture and paired export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: payload-architecture-py${{ matrix.python-version }}
          path: generated/payload-architecture-ci/
          if-no-files-found: error
          retention-days: 7
      - name: Record successful validation and runtime
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/installed-architecture-${{ matrix.python-version }}.json
      - name: Retain required job receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-installed-architecture-${{ matrix.python-version }}
          path: generated/ci/installed-architecture-${{ matrix.python-version }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  circuit-integration:
    needs: ci-preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record tested revision and platform
        run: python -c "import os, platform; print('Revision:', os.environ['GITHUB_SHA']); print('Platform:', platform.platform()); print('Python:', platform.python_version())"
      - name: Record job authority and start time
        run: python tools/ci_validation.py start --job circuit-integration --variant ${{ matrix.python-version }} --output generated/ci/start.json
      - name: Install package
        run: python -m pip install .
      - name: Check source metadata and circuit infrastructure outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          INFRA_OUTPUT: ${{ github.workspace }}/generated/circuit-infrastructure-ci
          SOURCE_OUTPUT: ${{ github.workspace }}/generated/circuit-sources-ci
          REVIEW_OUTPUT: ${{ github.workspace }}/generated/circuit-review-ci
        run: |
          python "$GITHUB_WORKSPACE/examples/circuit_sources.py" --output "$SOURCE_OUTPUT"
          biocompiler circuit-sources-check --inventory "$SOURCE_OUTPUT/inventory.json" --output "$SOURCE_OUTPUT/cli.assessment.json"
          biocompiler circuit-sources-verify "$SOURCE_OUTPUT/cli.assessment.json" --expected-inventory "$SOURCE_OUTPUT/inventory.json"
          biocompiler circuit-sources-readiness "$SOURCE_OUTPUT/inventory.json" --output "$SOURCE_OUTPUT/cli.readiness.json"
          python "$GITHUB_WORKSPACE/examples/circuit_infrastructure.py" --output "$INFRA_OUTPUT"
          biocompiler circuit-bindings-check "$INFRA_OUTPUT/candidate.json" --expected-request "$INFRA_OUTPUT/binding-request.json" --output "$INFRA_OUTPUT/cli.binding-assessment.json"
          biocompiler circuit-bindings-verify "$INFRA_OUTPUT/cli.binding-assessment.json" --candidate "$INFRA_OUTPUT/candidate.json" --expected-request "$INFRA_OUTPUT/binding-request.json"
          biocompiler circuit-evidence-capture "$INFRA_OUTPUT/build.json" --expected-request "$INFRA_OUTPUT/evidence-request.json" --output "$INFRA_OUTPUT/cli.evidence-receipt.json"
          biocompiler circuit-evidence-check "$INFRA_OUTPUT/cli.evidence-receipt.json" --build "$INFRA_OUTPUT/build.json" --expected-request "$INFRA_OUTPUT/evidence-request.json" --output "$INFRA_OUTPUT/cli.evidence-assessment.json"
          biocompiler circuit-evidence-verify "$INFRA_OUTPUT/cli.evidence-assessment.json" --receipt "$INFRA_OUTPUT/cli.evidence-receipt.json" --build "$INFRA_OUTPUT/build.json" --expected-request "$INFRA_OUTPUT/evidence-request.json"
          biocompiler circuit-inspect "$INFRA_OUTPUT/build.json" --expected-request "$INFRA_OUTPUT/request.json" --output "$INFRA_OUTPUT/cli.inspection.json"
          biocompiler circuit-diff "$INFRA_OUTPUT/build.json" "$INFRA_OUTPUT/build.json" --expected-before "$INFRA_OUTPUT/request.json" --expected-after "$INFRA_OUTPUT/request.json" --output "$INFRA_OUTPUT/cli.diff.json"
          python "$GITHUB_WORKSPACE/examples/circuit_review.py" --output "$REVIEW_OUTPUT"
          biocompiler circuit-review-create "$REVIEW_OUTPUT/build.json" --expected-authority "$REVIEW_OUTPUT/authority.json" --source-assessment "$REVIEW_OUTPUT/source-assessment.json" --binding-assessment "$REVIEW_OUTPUT/binding-assessment.json" --evidence-receipt "$REVIEW_OUTPUT/evidence-receipt.json" --evidence-assessment "$REVIEW_OUTPUT/evidence-assessment.json" --output "$REVIEW_OUTPUT/cli.review.bcb"
          biocompiler circuit-review-inspect "$REVIEW_OUTPUT/cli.review.bcb" --output "$REVIEW_OUTPUT/inspection.json"
          biocompiler circuit-review-verify "$REVIEW_OUTPUT/cli.review.bcb" --expected-authority "$REVIEW_OUTPUT/authority.json" --output "$REVIEW_OUTPUT/cli.verification.json"
          biocompiler inspect "$REVIEW_OUTPUT/authority.json"
          python -c "import os, pathlib; p = pathlib.Path(os.environ['REVIEW_OUTPUT']); assert (p / 'review.bcb').read_bytes() == (p / 'cli.review.bcb').read_bytes(); assert (p / 'verification.json').read_bytes() == (p / 'cli.verification.json').read_bytes()"
      - name: Retain infrastructure contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: circuit-infrastructure-evidence-py${{ matrix.python-version }}
          path: |
            generated/circuit-infrastructure-ci/
            generated/circuit-sources-ci/
            generated/circuit-review-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build and replay supplied circuit constructions outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          CIRCUIT_OUTPUT: ${{ github.workspace }}/generated/circuit-construction-ci
        run: |
          python "$GITHUB_WORKSPACE/examples/circuit_construction.py" --output "$CIRCUIT_OUTPUT"
          biocompiler circuit-build --request "$CIRCUIT_OUTPUT/request.json" --output "$CIRCUIT_OUTPUT/cli.build.json"
          biocompiler circuit-verify "$CIRCUIT_OUTPUT/cli.build.json" --expected-request "$CIRCUIT_OUTPUT/request.json"
          biocompiler circuit-export "$CIRCUIT_OUTPUT/cli.build.json" --expected-request "$CIRCUIT_OUTPUT/request.json" --output "$CIRCUIT_OUTPUT/export.json"
          biocompiler circuit-verify "$CIRCUIT_OUTPUT/export.json" --expected-request "$CIRCUIT_OUTPUT/request.json"
          biocompiler inspect "$CIRCUIT_OUTPUT/request.json"
          biocompiler inspect "$CIRCUIT_OUTPUT/candidate.json"
          biocompiler inspect "$CIRCUIT_OUTPUT/assessment.json"
          biocompiler inspect "$CIRCUIT_OUTPUT/export.json"
          python -c "import json, os, pathlib; p = pathlib.Path(os.environ['CIRCUIT_OUTPUT']); assert json.loads((p / 'build.json').read_text()) == json.loads((p / 'cli.build.json').read_text()) == json.loads((p / 'export.json').read_text())"
      - name: Retain supplied circuit construction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: circuit-construction-evidence-py${{ matrix.python-version }}
          path: generated/circuit-construction-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Inspect structured circuit molecule declarations
        run: |
          python examples/circuit_molecules.py --output generated/circuit-molecules-ci
          biocompiler inspect generated/circuit-molecules-ci/bundle.json
          biocompiler inspect generated/circuit-molecules-ci/record.json
      - name: Retain declared molecule identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: circuit-molecule-declarations-py${{ matrix.python-version }}
          path: generated/circuit-molecules-ci/
      - name: Check circuit intent authoring and independent replay
        run: |
          python examples/circuit_intent.py --output generated/circuit-intent-ci
          biocompiler circuit-intent-check --request generated/circuit-intent-ci/product.request.json --output generated/circuit-intent-ci/cli.assessment.json
          biocompiler circuit-intent-verify generated/circuit-intent-ci/cli.assessment.json --expected-request generated/circuit-intent-ci/product.request.json
          biocompiler inspect generated/circuit-intent-ci/reference.request.json
          biocompiler inspect generated/circuit-intent-ci/cli.assessment.json
      - name: Retain circuit intent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: circuit-intent-evidence-py${{ matrix.python-version }}
          path: generated/circuit-intent-ci/
      - name: Check human circuit profile scope and independent authority
        run: |
          python examples/circuit_profile.py --output generated/circuit-profile-ci
          biocompiler circuit-profile-check --request generated/circuit-profile-ci/product.request.json --output generated/circuit-profile-ci/cli.assessment.json
          biocompiler circuit-profile-verify generated/circuit-profile-ci/cli.assessment.json --expected-request generated/circuit-profile-ci/product.request.json
          biocompiler inspect generated/circuit-profile-ci/reference.request.json
          biocompiler inspect generated/circuit-profile-ci/cli.assessment.json
      - name: Retain circuit profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: circuit-profile-evidence-py${{ matrix.python-version }}
          path: generated/circuit-profile-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record successful validation and runtime
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/circuit-integration-${{ matrix.python-version }}.json
      - name: Retain required job receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-circuit-integration-${{ matrix.python-version }}
          path: generated/ci/circuit-integration-${{ matrix.python-version }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  integration-examples:
    needs: ci-preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record tested revision and platform
        run: python -c "import os, platform; print('Revision:', os.environ['GITHUB_SHA']); print('Platform:', platform.platform()); print('Python:', platform.python_version())"
      - name: Record job authority and start time
        run: python tools/ci_validation.py start --job integration-examples --variant ${{ matrix.python-version }} --output generated/ci/start.json
      - name: Install package
        run: python -m pip install .
      - name: Check human benchmark audit integrity and claim boundaries
        run: python tools/check_human_benchmark_audit.py
      - name: Reconstruct reviewed partial material evidence
        run: python tools/check_material_reconciliation.py
      - name: Run authoring examples
        run: python examples/intent_programs.py
      - name: Compile and independently verify intent-directed molecular candidates
        run: |
          python examples/intent_candidate.py --output generated/intent-candidate-ci
          biocompiler candidate-build --request generated/intent-candidate-ci/product_a.request.json --output generated/intent-candidate-ci/cli.build.json
          biocompiler candidate-verify generated/intent-candidate-ci/cli.build.json --expected-request generated/intent-candidate-ci/product_a.request.json
          biocompiler candidate-fasta generated/intent-candidate-ci/cli.build.json --expected-request generated/intent-candidate-ci/product_a.request.json > generated/intent-candidate-ci/cli.fasta
      - name: Retain intent-directed molecular candidate evidence
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: intent-candidate-evidence-py${{ matrix.python-version }}
          path: generated/intent-candidate-ci
      - name: Run behavior trace example
        run: python examples/behavior_trace.py
      - name: Analyze requirements and compile declared molecular implementations
        run: |
          python examples/molecular_implementation.py --output generated/molecular-implementation-ci
          biocompiler implementation-analyze --request generated/molecular-implementation-ci/source.json --output generated/molecular-implementation-ci/requirements-cli.json
          biocompiler implementation-build --request generated/molecular-implementation-ci/compact.request.json --output generated/molecular-implementation-ci/cli.build.json
          biocompiler implementation-verify generated/molecular-implementation-ci/cli.build.json --expected-request generated/molecular-implementation-ci/compact.request.json
          biocompiler implementation-fasta generated/molecular-implementation-ci/cli.build.json --expected-request generated/molecular-implementation-ci/compact.request.json > generated/molecular-implementation-ci/cli.fasta
          biocompiler inspect generated/molecular-implementation-ci/requirements-cli.json
          biocompiler inspect generated/molecular-implementation-ci/cli.build.json
          python -c "import subprocess; result = subprocess.run(['biocompiler', 'implementation-build', '--request', 'generated/molecular-implementation-ci/strict.request.json', '--output', 'generated/molecular-implementation-ci/strict-cli.build.json']); assert result.returncode == 1, result.returncode"
      - name: Retain molecular implementation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: molecular-implementation-evidence-py${{ matrix.python-version }}
          path: generated/molecular-implementation-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run independent realization checks
        run: python examples/realization_check.py
      - name: Run checked request-to-synthetic pipeline
        run: python examples/checked_pipeline.py
      - name: Run checked temporal generation
        run: python examples/temporal_pipeline.py
      - name: Build and reconstruct portable temporal synthetic packages
        run: |
          python examples/synthetic_build.py --output generated/synthetic-ci
          biocompiler synthetic-build --request generated/synthetic-ci/request.json --output generated/synthetic-ci/cli.bcb > generated/synthetic-ci/build.json
          biocompiler synthetic-inspect generated/synthetic-ci/cli.bcb > generated/synthetic-ci/inspect.json
          biocompiler synthetic-verify generated/synthetic-ci/cli.bcb --expected-request generated/synthetic-ci/request.json > generated/synthetic-ci/verify.json
      - name: Retain synthetic workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: synthetic-workflow-python-${{ matrix.python-version }}
          path: generated/synthetic-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Select, compose and reconstruct a bounded digital design
        run: |
          python examples/synthetic_selection.py
          python examples/synthetic_design.py --output generated/synthetic-design-ci
          biocompiler synthetic-select --request generated/synthetic-design-ci/request.json --output generated/synthetic-design-ci/selection-cli.json > generated/synthetic-design-ci/selection-summary.json
          biocompiler synthetic-build --request generated/synthetic-design-ci/request.json --output generated/synthetic-design-ci/design-cli.bcb > generated/synthetic-design-ci/build-summary.json
          biocompiler synthetic-inspect generated/synthetic-design-ci/design-cli.bcb > generated/synthetic-design-ci/inspect.json
          biocompiler synthetic-verify generated/synthetic-design-ci/design-cli.bcb --expected-request generated/synthetic-design-ci/request.json > generated/synthetic-design-ci/verify.json
          biocompiler synthetic-explore --request generated/synthetic-design-ci/campaign-request.json --output generated/synthetic-design-ci/campaign-cli-record.json > generated/synthetic-design-ci/campaign-summary.json
          biocompiler synthetic-replay generated/synthetic-design-ci/campaign-cli-record.json --expected-request generated/synthetic-design-ci/campaign-request.json > generated/synthetic-design-ci/replay.json
