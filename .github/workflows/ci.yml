name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record tested revision and platform
        run: python -c "import os, platform; print('Revision:', os.environ['GITHUB_SHA']); print('Platform:', platform.platform()); print('Python:', platform.python_version())"
      - name: Check human benchmark audit integrity and claim boundaries
        run: python tools/check_human_benchmark_audit.py
      - name: Install package
        run: python -m pip install .
      - name: Test authoring, behavior, and realization contracts
        run: python -m unittest discover -s tests -v
      - name: Run authoring examples
        run: python examples/intent_programs.py
      - name: Run behavior trace example
        run: python examples/behavior_trace.py
      - name: Run independent realization checks
        run: python examples/realization_check.py
      - name: Run checked request-to-synthetic pipeline
        run: python examples/checked_pipeline.py
      - name: Run checked temporal generation
        run: python examples/temporal_pipeline.py
      - name: Build and reconstruct portable temporal synthetic packages
        run: |
          python examples/synthetic_build.py --output generated/synthetic-ci
          biocompiler synthetic-build --request generated/synthetic-ci/request.json --output generated/synthetic-ci/cli.bcb > generated/synthetic-ci/build.json
          biocompiler synthetic-inspect generated/synthetic-ci/cli.bcb > generated/synthetic-ci/inspect.json
          biocompiler synthetic-verify generated/synthetic-ci/cli.bcb --expected-request generated/synthetic-ci/request.json > generated/synthetic-ci/verify.json
      - name: Retain synthetic workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-workflow-python-${{ matrix.python-version }}
          path: generated/synthetic-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Select, compose and reconstruct a bounded digital design
        run: |
          python examples/synthetic_selection.py
          python examples/synthetic_design.py --output generated/synthetic-design-ci
          biocompiler synthetic-select --request generated/synthetic-design-ci/request.json --output generated/synthetic-design-ci/selection-cli.json > generated/synthetic-design-ci/selection-summary.json
          biocompiler synthetic-build --request generated/synthetic-design-ci/request.json --output generated/synthetic-design-ci/design-cli.bcb > generated/synthetic-design-ci/build-summary.json
          biocompiler synthetic-inspect generated/synthetic-design-ci/design-cli.bcb > generated/synthetic-design-ci/inspect.json
          biocompiler synthetic-verify generated/synthetic-design-ci/design-cli.bcb --expected-request generated/synthetic-design-ci/request.json > generated/synthetic-design-ci/verify.json
          biocompiler synthetic-explore --request generated/synthetic-design-ci/campaign-request.json --output generated/synthetic-design-ci/campaign-cli-record.json > generated/synthetic-design-ci/campaign-summary.json
          biocompiler synthetic-replay generated/synthetic-design-ci/campaign-cli-record.json --expected-request generated/synthetic-design-ci/campaign-request.json > generated/synthetic-design-ci/replay.json
      - name: Retain and replay failed temporal verification evidence
        run: |
          python examples/synthetic_verification.py --output generated/synthetic-verification-ci
          biocompiler synthetic-check --request generated/synthetic-verification-ci/check-request.json --output generated/synthetic-verification-ci/check-cli-record.json > generated/synthetic-verification-ci/check-summary.json
          python -c "import subprocess; result = subprocess.run(['biocompiler', 'synthetic-check', '--request', 'generated/synthetic-verification-ci/wrong-reset-request.json', '--output', 'generated/synthetic-verification-ci/wrong-reset-cli-record.json']); assert result.returncode == 1, result.returncode" > generated/synthetic-verification-ci/wrong-reset-summary.json
          biocompiler synthetic-reduce --request generated/synthetic-verification-ci/reduction-request.json --output generated/synthetic-verification-ci/reduction-cli-record.json > generated/synthetic-verification-ci/reduction-summary.json
          biocompiler synthetic-replay generated/synthetic-verification-ci/reduction-cli-record.json --expected-request generated/synthetic-verification-ci/reduction-request.json > generated/synthetic-verification-ci/replay.json
          biocompiler inspect generated/synthetic-verification-ci/wrong-reset-cli-record.json > generated/synthetic-verification-ci/inspection.json
      - name: Retain design selection and verification workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-design-python-${{ matrix.python-version }}
          path: |
            generated/synthetic-design-ci/
            generated/synthetic-verification-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run checked component linking and reference selection
        run: python examples/component_linking.py
      - name: Assemble and reconstruct complete structural RNA designs
        run: |
          python examples/molecular_design.py --output generated/molecular-design-ci
          biocompiler molecular-design-build --request generated/molecular-design-ci/request.json --output generated/molecular-design-ci/cli.bcb > generated/molecular-design-ci/build-summary.json
          biocompiler molecular-design-inspect generated/molecular-design-ci/cli.bcb > generated/molecular-design-ci/inspection.json
          biocompiler molecular-design-verify generated/molecular-design-ci/cli.bcb --expected-request generated/molecular-design-ci/request.json > generated/molecular-design-ci/verification.json
          biocompiler inspect generated/molecular-design-ci/handoff.json > generated/molecular-design-ci/handoff-inspection.json
          biocompiler inspect generated/molecular-design-ci/substitution-failure.json > generated/molecular-design-ci/failure-inspection.json
      - name: Retain molecular design and candidate-checking evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molecular-design-python-${{ matrix.python-version }}
          path: generated/molecular-design-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run checked DNA and RNA reference construct assembly
        run: python examples/reference_construct.py
      - name: Emit, check and export exact DNA and RNA reference CDSs
        run: python examples/reference_sequences.py
      - name: Build and reconstruct portable reference packages
        run: |
          mkdir -p generated/reference-ci
          python examples/reference_build.py > generated/reference-ci/example.log 2>&1
          biocompiler reference-build --alphabet RNA --reference-dir data/references/fap_car --output generated/reference-ci/rna.bcb > generated/reference-ci/build.json 2> generated/reference-ci/build.log
          biocompiler reference-inspect generated/reference-ci/rna.bcb > generated/reference-ci/inspect.json
          python -c "import json, pathlib, subprocess; identity = json.loads(pathlib.Path('generated/reference-ci/build.json').read_text())['build_fingerprint']; subprocess.run(['biocompiler', 'reference-verify', 'generated/reference-ci/rna.bcb', '--expected-build', identity], check=True)" > generated/reference-ci/verify.json 2> generated/reference-ci/verify.log
      - name: Run bounded verification and preserve counterexample evidence
        run: |
          mkdir -p generated/verification-ci
          python examples/verification_campaign.py --output generated/verification-ci > generated/verification-ci/campaign.log 2>&1
          cat generated/verification-ci/campaign.log
          biocompiler inspect generated/verification-ci/bounded-report.json > generated/verification-ci/inspection.json
      - name: Retain verification campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-python-${{ matrix.python-version }}
          path: generated/verification-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check molecular correspondence and whole-molecule readiness
        run: |
          mkdir -p generated/m9-ci
          python examples/molecular_contract.py --output generated/m9-ci/molecular > generated/m9-ci/molecular.log 2>&1
          cat generated/m9-ci/molecular.log
          python examples/payload_readiness.py --output generated/m9-ci/payload > generated/m9-ci/payload.log 2>&1
          cat generated/m9-ci/payload.log
          biocompiler inspect generated/m9-ci/molecular/molecular-behavior-result.json > generated/m9-ci/molecular-inspection.json
      - name: Retain M9 contract and readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molecular-readiness-python-${{ matrix.python-version }}
          path: generated/m9-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain reference build failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reference-build-failure-python-${{ matrix.python-version }}
          path: generated/reference-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Inspect CLI
        run: |
          biocompiler --version
          biocompiler architecture
      - name: Record and inspect unresolved human target contract
        run: |
          python examples/human_target.py --output generated/human-target-ci
          biocompiler inspect generated/human-target-ci/human-target.json
      - name: Check and inspect bounded human secretion contracts
        run: |
          python examples/human_behavior.py --output generated/human-behavior-ci
          biocompiler inspect generated/human-behavior-ci/human-behavior-request.json
          biocompiler inspect generated/human-behavior-ci/trace-pass.json
          biocompiler inspect generated/human-behavior-ci/trace-fail.json
          biocompiler inspect generated/human-behavior-ci/trace-unknown.json
      - name: Retain human behavior contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-behavior-evidence-python-${{ matrix.python-version }}
          path: generated/human-behavior-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check and inspect human deployment contracts
        run: |
          python examples/human_deployment.py --output generated/deployment-ci
          biocompiler inspect generated/deployment-ci/request-unknown.json
          biocompiler inspect generated/deployment-ci/assessment-pass.json
          biocompiler inspect generated/deployment-ci/assessment-fail.json
          biocompiler inspect generated/deployment-ci/assessment-unsupported.json
      - name: Retain deployment contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-python-${{ matrix.python-version }}
          path: generated/deployment-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check and inspect required and prohibited human behavior
        run: |
          python examples/human_acceptance.py --output generated/acceptance-ci
          biocompiler inspect generated/acceptance-ci/human-acceptance-request.json
          biocompiler inspect generated/acceptance-ci/assessment-pass.json
          biocompiler inspect generated/acceptance-ci/assessment-fail.json
          biocompiler inspect generated/acceptance-ci/assessment-unknown.json
          biocompiler inspect generated/acceptance-ci/assessment-unsupported.json
      - name: Retain human acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-acceptance-evidence-python-${{ matrix.python-version }}
          path: generated/acceptance-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check human admission and inspect software-only artifacts
        run: |
          python examples/human_admission.py --output generated/admission-ci
          biocompiler inspect generated/admission-ci/human-request.json
          biocompiler inspect generated/admission-ci/human-assessment.json
          biocompiler inspect generated/admission-ci/software-assessment.json
          biocompiler inspect generated/admission-ci/human-selection.json
      - name: Retain human admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-admission-evidence-python-${{ matrix.python-version }}
          path: generated/admission-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run and recheck proposed human profile cases
        run: |
          python examples/human_profile_cases.py --output generated/profile-cases-ci
          python examples/human_profile_cases.py --verify generated/profile-cases-ci
          biocompiler inspect generated/profile-cases-ci/positive/request.json
          biocompiler inspect generated/profile-cases-ci/positive/acceptance.json
          biocompiler inspect generated/profile-cases-ci/conflicting_healthy/acceptance.json
          biocompiler inspect generated/profile-cases-ci/underspecified_deployment/deployment.json
          biocompiler inspect generated/profile-cases-ci/unsupported_co_payload/admission.json
      - name: Retain proposed human profile cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-profile-cases-python-${{ matrix.python-version }}
          path: generated/profile-cases-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Import scaffold interfaces
        run: |
          python -c "from biocompiler.compiler.passes import CompilerPass, PassResult; from biocompiler.semantics.context import TargetContext; from biocompiler.verification.evidence import Obligation"
