  studio-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record tested revision and platform
        run: |
          python -c "import os, platform; print('Revision:', os.environ['GITHUB_SHA']); print('Platform:', platform.platform()); print('Python:', platform.python_version())"
          node --version
      - name: Record job authority and start time
        run: python tools/ci_validation.py start --job studio-browser --variant 3.11 --output generated/ci/start.json
      - name: Install package and browser test tools
        run: |
          python -m pip install .
          npm install --prefix generated/browser-tools --no-save --ignore-scripts playwright@1.62.1
          node generated/browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise the installed guided workspace in a browser
        env:
          NODE_PATH: ${{ github.workspace }}/generated/browser-tools/node_modules
          STUDIO_TEST_OUTPUT: ${{ github.workspace }}/generated/studio-browser-ci
        run: node tests/browser/studio.cjs
      - name: Exercise retained construction inspection and lossless save in a browser
        env:
          NODE_PATH: ${{ github.workspace }}/generated/browser-tools/node_modules
          STUDIO_TEST_OUTPUT: ${{ github.workspace }}/generated/studio-browser-ci
          CIRCUIT_INFRASTRUCTURE_OUTPUT: ${{ github.workspace }}/generated/circuit-infrastructure-ci
          CIRCUIT_SOURCES_OUTPUT: ${{ github.workspace }}/generated/circuit-sources-ci
          CONSTRUCTION_BROWSER_SUITE: inspection
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/examples/circuit_infrastructure.py" --output "$CIRCUIT_INFRASTRUCTURE_OUTPUT"
          python "$GITHUB_WORKSPACE/examples/circuit_sources.py" --output "$CIRCUIT_SOURCES_OUTPUT"
          node "$GITHUB_WORKSPACE/tests/browser/construction.cjs"
      - name: Exercise current source binding and evidence review in a browser
        env:
          NODE_PATH: ${{ github.workspace }}/generated/browser-tools/node_modules
          STUDIO_TEST_OUTPUT: ${{ github.workspace }}/generated/studio-browser-ci
          CIRCUIT_INFRASTRUCTURE_OUTPUT: ${{ github.workspace }}/generated/circuit-infrastructure-ci
          CIRCUIT_SOURCES_OUTPUT: ${{ github.workspace }}/generated/circuit-sources-ci
          CONSTRUCTION_BROWSER_SUITE: review
        run: node tests/browser/construction.cjs
      - name: Retain GUI screenshots and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: studio-browser-evidence
          path: generated/studio-browser-ci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record successful validation and runtime
        run: python tools/ci_validation.py finish --start generated/ci/start.json --output generated/ci/studio-browser-3.11.json
      - name: Retain required job receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-studio-browser-3.11
          path: generated/ci/studio-browser-3.11.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  ocaml-core:
    runs-on: ${{ matrix.runner }}
    # Complete installed campaigns and every corpus exceeded 90 minutes on Linux.
    # Preserve every check; this allowance is not a measured runtime target.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-14
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record revision and verify the actual native platform
        run: python tools/ci_validation.py start --job ocaml-core --variant ${{ matrix.platform }} --output generated/ci/start.json
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3, pinned 2026-10-01
        with:
          ocaml-compiler: "5.4.0"
          opam-pin: false
          opam-repositories: |
            default: git+https://github.com/ocaml/opam-repository.git#ac27950e5eac6c981ad809dff370c937820b7893
      - name: Resolve pinned native dependencies and retain the platform lock
        run: |
          opam install core/biocompiler_core.opam --deps-only --with-test --yes
          opam lock core/biocompiler_core.opam
          mkdir -p generated/core
          cp biocompiler_core.opam.locked generated/core/dependencies.opam.locked
          opam switch export generated/core/switch.export
          opam list --installed --columns=name,version > generated/core/packages.txt
      - name: Install Python package and check compiler/checker dependency separation
        run: |
          python -m pip install .
          python tools/check_core_boundaries.py --output generated/core/boundaries.json
      - name: Strictly type-check the migrated Python transport boundary
        run: |
          python -m pip install --only-binary=:all: --platform any --require-hashes \
            --target generated/typecheck -r tools/typecheck-requirements.txt
          PYTHONPATH=generated/typecheck python -m mypy --config-file tools/mypy-core.ini | tee generated/core/python-types.txt
      - name: Compile native core and standalone verifier
        id: native_build
        run: |
          opam exec -- dune build --root core @all
      - name: Run every native literal and mutation suite
        run: |
          set -o pipefail
          BIOCOMPILER_CANDIDATE_RUNTIME_CORPUS="$GITHUB_WORKSPACE/tests/conformance/candidate-runtime-v1.json" \
          BIOCOMPILER_COMPONENT_RUNTIME_CORPUS="$GITHUB_WORKSPACE/tests/conformance/component-runtime-v1.json" \
          BIOCOMPILER_REALIZATION_FOUNDATION_CORPUS="$GITHUB_WORKSPACE/tests/conformance/realization-foundation-v1.json" \
          BIOCOMPILER_REALIZATION_CHECKS_CORPUS="$GITHUB_WORKSPACE/tests/conformance/realization-checks-v1.json" \
          BIOCOMPILER_COMPONENT_ACCEPTANCE_CORPUS="$GITHUB_WORKSPACE/tests/conformance/component-acceptance-v1.json" \
          BIOCOMPILER_SYNTHETIC_AUTHORITY_CORPUS="$GITHUB_WORKSPACE/tests/conformance/synthetic-authority-v1.json" \
          BIOCOMPILER_SYNTHETIC_ACCEPTANCE_CORPUS="$GITHUB_WORKSPACE/tests/conformance/synthetic-acceptance-v1.json" \
          BIOCOMPILER_SYNTHETIC_PRODUCERS_CORPUS="$GITHUB_WORKSPACE/tests/conformance/synthetic-producers-v1.json" \
          BIOCOMPILER_REALIZATION_WORKFLOW_CORPUS="$GITHUB_WORKSPACE/tests/conformance/realization-workflow-v1.json" \
          BIOCOMPILER_CHECKED_PIPELINE_CORPUS="$GITHUB_WORKSPACE/tests/conformance/checked-pipeline-v1.json" \
          BIOCOMPILER_FIXED_PIPELINE_CONTINUATIONS="$GITHUB_WORKSPACE/tests/conformance/fixed-pipeline-continuations-native-v1.json" \
          BIOCOMPILER_FIXED_PIPELINE_CORPUS="$GITHUB_WORKSPACE/tests/conformance/fixed-pipeline-native-v1.json" \
          BIOCOMPILER_LOWERING_CORPUS="$GITHUB_WORKSPACE/tests/conformance/lowering-v1.json" \
          BIOCOMPILER_PIPELINE_CALLBACK_SEMANTICS="$GITHUB_WORKSPACE/tests/conformance/pipeline-callback-semantics-v1.json" \
          BIOCOMPILER_PIPELINE_SESSION_DECLARATION="$GITHUB_WORKSPACE/protocol/pipeline-session-v1.json" \
          BIOCOMPILER_PIPELINE_CONTRACT_LITERALS="$GITHUB_WORKSPACE/tests/conformance/pipeline-contract-literals-v1.json" \
          BIOCOMPILER_SYNTHETIC_INSPECTION_DECLARATION="$GITHUB_WORKSPACE/protocol/synthetic-inspection-v1.json" \
          BIOCOMPILER_SYNTHETIC_INSPECTION_FIXTURES="$GITHUB_WORKSPACE/tests/conformance/synthetic-inspection-supplemental-v1.json" \
            opam exec -- dune runtest --root core 2>&1 | tee generated/core/native-tests.txt
      - name: Retain native suite diagnostics before longer installed campaigns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-native-tests-${{ matrix.platform }}
          path: generated/core/native-tests.txt
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      - name: Check retained request, behavior and coordinate domain corpora
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          core/_build/default/test/test_build_request.exe "$GITHUB_WORKSPACE/tests/conformance/case-b" | tee generated/core/build-request-domain.txt
          core/_build/default/test/test_behavior.exe "$GITHUB_WORKSPACE/tests/conformance/case-b" "$GITHUB_WORKSPACE/tests/conformance/behavior-domains-v1.json" | tee generated/core/behavior-domain.txt
          core/_build/default/test/test_molecule_coordinates.exe "$GITHUB_WORKSPACE/tests/conformance/molecule-coordinates-v1.json" | tee generated/core/molecule-coordinates-domain.txt
          core/_build/default/test/test_circuit_request.exe "$GITHUB_WORKSPACE/tests/conformance/request-domains-v1.json" | tee generated/core/circuit-request-domain.txt
          core/_build/default/test/test_lowering_check.exe "$GITHUB_WORKSPACE/tests/conformance/case-b" "$GITHUB_WORKSPACE/tests/conformance/request-domains-v1.json" | tee generated/core/lowering-check.txt
      - name: Check exact scalar arithmetic and complete per-role reference traces
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          core/_build/default/test/test_runtime_number.exe "$GITHUB_WORKSPACE/tests/conformance/runtime-numbers-v1.json" | tee generated/core/runtime-numbers.txt
          core/_build/default/test/test_execution_data.exe "$GITHUB_WORKSPACE/tests/conformance/reference-execution-v1.json" | tee generated/core/execution-data.txt
          core/_build/default/test/test_reference.exe "$GITHUB_WORKSPACE/tests/conformance/reference-execution-v1.json" | tee generated/core/reference-execution.txt
      - name: Check fresh lowering against exact retained source authority
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: core/_build/default/test/test_lowering.exe "$GITHUB_WORKSPACE/tests/conformance/lowering-v1.json" | tee generated/core/lowering-producer.txt
      - name: Check component domains and fresh compatibility assessments
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: core/_build/default/test/test_component_contract.exe "$GITHUB_WORKSPACE/tests/conformance/component-contracts-v1.json" | tee generated/core/component-contracts.txt
      - name: Check bounded molecular declarations and serialization
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: core/_build/default/test/test_molecular_record.exe "$GITHUB_WORKSPACE/tests/conformance/molecule-chemistry-v1.json" | tee generated/core/molecular-records.txt
      - name: Check molecular chemistry and nominal identity
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
