name: Policy development feedback

on:
  push:
    branches: ['codex/dev-policy/**']

# This group cannot cancel any release workflow or another development branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  development-feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Authenticate hosted push and exact sources before native setup
        env:
          PYTHONPATH: src
        run: |
          python -B tools/check_policy_development.py prepare
          python -B tools/generate_policy_wire_schema.py --check
          python -B tools/check_policy_source_context_coverage.py
          python -B tools/check_policy_material_rule_coverage.py
          python -B tools/check_policy_public_api_coverage.py
          python -B tools/migration_inventory.py --check
          python -B -m tools.generate_policy_quantitative_composition_fixture --check
          python -B -m tools.generate_policy_approximation_fixture --check
          python -B -m tools.generate_policy_realization_evidence_fixture --check
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7
        with:
          ocaml-compiler: '5.4.0'
          opam-pin: false
          opam-repositories: |
            default: git+https://github.com/ocaml/opam-repository.git#ac27950e5eac6c981ad809dff370c937820b7893
      - name: Install ordinary dependencies, build once and run the fixed native suite inventory
        run: python -B tools/check_policy_development.py run
      - name: Exercise quantitative assurance through the same fresh native build
        env:
          PYTHONPATH: src
        run: |
          python -B tools/check_policy_quantitative_assurance.py \
            --core "$GITHUB_WORKSPACE/core/_build/default/bin/core/main.exe" \
            --verify "$GITHUB_WORKSPACE/core/_build/default/bin/verify/main.exe" \
            --output "$GITHUB_WORKSPACE/generated/development-feedback/quantitative-assurance.json"
      - name: Exercise all ten complete SDK campaigns in two bounded lanes
        env:
          PYTHONPATH: src
        run: python -B tools/check_policy_development.py sdk-all
      - name: Retain diagnostic evidence even when native work fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-feedback-${{ github.run_id }}-${{ github.run_attempt }}
          path: generated/development-feedback/
          if-no-files-found: error
          retention-days: 7
