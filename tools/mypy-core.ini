[mypy]
python_version = 3.11
strict = True
files = src/biocompiler/core_client.py, src/biocompiler/core_architecture.py, src/biocompiler/core_architecture_producer.py, src/biocompiler/architecture_backend.py, src/biocompiler/core_realization.py, src/biocompiler/realization_backend.py, src/biocompiler/core_artifacts.py, src/biocompiler/core_workflow.py, src/biocompiler/workflow_backend.py, src/biocompiler/core_workflow_authority.py, src/biocompiler/workflow_cli.py, src/biocompiler/core_synthetic_producer.py, src/biocompiler/synthetic_producer_backend.py, src/biocompiler/core_synthetic_producer_public.py, src/biocompiler/synthetic_producer_cli.py
# These transport modules are explicitly checked together. Legacy package initializer
# imports remain in the migration inventory; they are outside this narrow gate.
follow_imports = skip
cache_dir = generated/mypy-static/cache

[mypy-biocompiler.errors]
follow_imports = normal
