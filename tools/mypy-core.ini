[mypy]
python_version = 3.11
strict = True
files = src/biocompiler/core_distribution.py, src/biocompiler/reference_backend.py, src/biocompiler/core_reference_host.py, src/biocompiler/core_reference_provider_views.py, src/biocompiler/core_reference_manager.py, src/biocompiler/core_reference_views.py, src/biocompiler/core_pipeline_build_views.py, src/biocompiler/core_pipeline_provider_views.py, src/biocompiler/core_pipeline_manager.py, src/biocompiler/core_pipeline_callback_session.py, src/biocompiler/pipeline_callback_objects.py, src/biocompiler/core_pipeline_session.py, src/biocompiler/core_client.py, src/biocompiler/core_architecture.py, src/biocompiler/core_architecture_producer.py, src/biocompiler/architecture_backend.py, src/biocompiler/core_realization.py, src/biocompiler/realization_backend.py, src/biocompiler/core_artifacts.py, src/biocompiler/core_workflow.py, src/biocompiler/workflow_backend.py, src/biocompiler/core_workflow_authority.py, src/biocompiler/workflow_cli.py, src/biocompiler/core_synthetic_producer.py, src/biocompiler/synthetic_producer_backend.py, src/biocompiler/core_synthetic_producer_public.py, src/biocompiler/synthetic_producer_cli.py, src/biocompiler/core_synthetic_inspection.py, src/biocompiler/core_package_files.py, src/biocompiler/core_package_owner.py, src/biocompiler/core_reference_package_host.py, src/biocompiler/core_reference_package_io.py, src/biocompiler/core_reference_package_origins.py, src/biocompiler/core_reference_package_protocol.py, src/biocompiler/core_reference_package_route.py, src/biocompiler/core_reference_package_source.py, src/biocompiler/core_reference_package_verify.py, src/biocompiler/core_reference_package_views.py, src/biocompiler/reference_package_backend.py
# These transport modules are explicitly checked together. Legacy package initializer
# imports remain in the migration inventory; they are outside this narrow gate.
follow_imports = skip
cache_dir = generated/mypy-static/cache

[mypy-biocompiler.errors]
follow_imports = normal
