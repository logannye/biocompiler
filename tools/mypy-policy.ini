[mypy]
python_version = 3.11
strict = True
files = src/biocompiler/policy
follow_imports = skip
cache_dir = generated/mypy-policy/cache

[mypy-biocompiler.policy.*]
follow_imports = normal

# Keep the explicit native transport return types available to public wrappers.
# These modules are also checked by the core configuration; no semantic imports
# are executed by this static dependency traversal.
[mypy-biocompiler.core_client,biocompiler.core_policy,biocompiler.core_policy_operational,biocompiler.core_policy_implementation,biocompiler.core_policy_material,biocompiler.core_policy_component_material,biocompiler.core_policy_component_selection]
follow_imports = normal
