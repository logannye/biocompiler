[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biocompiler"
version = "0.1.0.dev19"
description = "An experimental compiler aiming to translate high-level therapeutic intent into precise DNA/RNA payloads for in vivo immune cell therapies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
biocompiler = "biocompiler.cli:main"

[project.urls]
Repository = "https://github.com/logannye/biocompiler"
Documentation = "https://github.com/logannye/biocompiler/blob/main/README.md"
Roadmap = "https://github.com/logannye/biocompiler/blob/main/docs/roadmap.md"
Issues = "https://github.com/logannye/biocompiler/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biocompiler = ["py.typed", "studio/static/*", "studio/data/*.json"]
