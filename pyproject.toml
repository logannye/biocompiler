[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biocompiler"
version = "0.1.0.dev13"
description = "A compiler architecture for translating cellular intent into traceable nucleic-acid payload specifications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
biocompiler = "biocompiler.cli:main"

[project.urls]
Repository = "https://github.com/logannye/biocompiler"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biocompiler = ["py.typed"]
